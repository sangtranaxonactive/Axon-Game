# Render blueprint: New > Blueprint > pick this repo. One instance only (room state lives in memory).
services:
  - type: web
    name: yep-racing
    runtime: docker
    plan: starter
    healthCheckPath: /api/stats
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: HOST_CODE
        generateValue: true
    disk:
      name: leaderboard
      mountPath: /data
      sizeGB: 1
